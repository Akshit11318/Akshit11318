<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="Akshit, LLM inference, CUDA, and systems">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="55%" stop-color="#05080f"/>
      <stop offset="100%" stop-color="#02040a"/>
    </linearGradient>
    <radialGradient id="bluewash" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenwash" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floorfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="28%" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="3" result="n">
        <animate attributeName="baseFrequency" values="0.7;0.95;0.7" dur="6s" repeatCount="indefinite"/>
      </feTurbulence>
      <feColorMatrix type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.65  0 0 0 0 1  0 0 0 0.55 0" in="n"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <mask id="floormask">
      <rect x="0" y="250" width="1200" height="370" fill="url(#floorfade)"/>
    </mask>
    <clipPath id="floorclip">
      <rect x="0" y="268" width="1200" height="352"/>
    </clipPath>
    <path id="arc1" d="M40,210 C220,40 420,60 600,150" fill="none"/>
    <path id="arc2" d="M1160,80 C980,20 820,90 700,190" fill="none"/>
    <path id="arc3" d="M80,300 C300,180 520,240 760,120" fill="none"/>
    <path id="rail" d="M150,548 H1050" fill="none"/>
  </defs>

  <rect width="1200" height="620" fill="url(#sky)"/>
  <ellipse cx="300" cy="150" rx="380" ry="150" fill="url(#bluewash)"/>
  <ellipse cx="940" cy="190" rx="320" ry="130" fill="url(#greenwash)"/>
  <rect width="1200" height="620" filter="url(#grain)" opacity="0.22"/>

  <!-- rushing floor -->
  <g mask="url(#floormask)" clip-path="url(#floorclip)" fill="none" stroke-linecap="round">
    <g stroke="#1f6feb" stroke-opacity="0.55" stroke-width="1.2">
      <line x1="600" y1="268" x2="-40" y2="640"/>
      <line x1="600" y1="268" x2="80" y2="640"/>
      <line x1="600" y1="268" x2="200" y2="640"/>
      <line x1="600" y1="268" x2="320" y2="640"/>
      <line x1="600" y1="268" x2="440" y2="640"/>
      <line x1="600" y1="268" x2="560" y2="640"/>
      <line x1="600" y1="268" x2="680" y2="640"/>
      <line x1="600" y1="268" x2="800" y2="640"/>
      <line x1="600" y1="268" x2="920" y2="640"/>
      <line x1="600" y1="268" x2="1040" y2="640"/>
      <line x1="600" y1="268" x2="1160" y2="640"/>
      <line x1="600" y1="268" x2="1280" y2="640"/>
    </g>
    <g stroke="#3fb950" stroke-opacity="0.45" stroke-width="1.1">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="0 48" dur="1.35s" repeatCount="indefinite"/>
      <line x1="0" y1="250" x2="1200" y2="250"/>
      <line x1="40" y1="298" x2="1160" y2="298"/>
      <line x1="70" y1="346" x2="1130" y2="346"/>
      <line x1="100" y1="394" x2="1100" y2="394"/>
      <line x1="130" y1="442" x2="1070" y2="442"/>
      <line x1="160" y1="490" x2="1040" y2="490"/>
      <line x1="190" y1="538" x2="1010" y2="538"/>
      <line x1="220" y1="586" x2="980" y2="586"/>
      <line x1="250" y1="634" x2="950" y2="634"/>
    </g>
  </g>

  <!-- edge streams -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
    <g fill="#3fb950" opacity="0.55">
      <animateTransform attributeName="transform" type="translate" from="0 40" to="0 -80" dur="7s" repeatCount="indefinite"/>
      <text x="28" y="40">1</text><text x="28" y="64">0</text><text x="28" y="88">1</text><text x="28" y="112">1</text>
      <text x="28" y="136">0</text><text x="28" y="160">1</text><text x="28" y="184">0</text><text x="28" y="208">0</text>
      <text x="28" y="232">1</text><text x="28" y="256">1</text><text x="28" y="280">0</text><text x="28" y="304">1</text>
      <text x="28" y="328">0</text><text x="28" y="352">1</text><text x="28" y="376">1</text><text x="28" y="400">0</text>
      <text x="46" y="52">0</text><text x="46" y="100">1</text><text x="46" y="148">0</text><text x="46" y="196">1</text>
      <text x="46" y="244">1</text><text x="46" y="292">0</text><text x="46" y="340">1</text><text x="46" y="388">0</text>
    </g>
    <g fill="#58A6FF" opacity="0.5">
      <animateTransform attributeName="transform" type="translate" from="0 -40" to="0 90" dur="8s" repeatCount="indefinite"/>
      <text x="1152" y="48">0</text><text x="1152" y="78">1</text><text x="1152" y="108">1</text><text x="1152" y="138">0</text>
      <text x="1152" y="168">1</text><text x="1152" y="198">0</text><text x="1152" y="228">1</text><text x="1152" y="258">0</text>
      <text x="1152" y="288">1</text><text x="1152" y="318">1</text><text x="1152" y="348">0</text><text x="1152" y="378">1</text>
      <text x="1170" y="60">1</text><text x="1170" y="110">0</text><text x="1170" y="160">1</text><text x="1170" y="210">0</text>
      <text x="1170" y="260">0</text><text x="1170" y="310">1</text><text x="1170" y="360">1</text>
    </g>
  </g>

  <!-- sparks -->
  <g filter="url(#glow)">
    <circle r="3" fill="#58A6FF">
      <animateMotion dur="7s" repeatCount="indefinite"><mpath xlink:href="#arc1"/></animateMotion>
    </circle>
    <circle r="2.6" fill="#3fb950">
      <animateMotion dur="8.5s" begin="1s" repeatCount="indefinite"><mpath xlink:href="#arc2"/></animateMotion>
    </circle>
    <circle r="2.2" fill="#79c0ff">
      <animateMotion dur="6.4s" begin="0.6s" repeatCount="indefinite"><mpath xlink:href="#arc3"/></animateMotion>
    </circle>
  </g>

  <!-- scan -->
  <rect x="0" y="0" width="1200" height="3" fill="#58A6FF" opacity="0.28">
    <animate attributeName="y" values="0;620;0" dur="5.5s" repeatCount="indefinite"/>
  </rect>

  <!-- name -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" font-size="92" letter-spacing="10">
    <text x="600" y="188" fill="#1f6feb" opacity="0.85">
      AKSHIT
      <animate attributeName="dx" values="-10;7;-4;9;-10" dur="2.6s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="188" fill="#3fb950" opacity="0.7">
      AKSHIT
      <animate attributeName="dx" values="8;-6;5;-8;8" dur="2.6s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="188" fill="#f0f6fc">AKSHIT</text>
  </g>
  <rect x="430" y="132" width="70" height="6" fill="#f0f6fc" opacity="0">
    <animate attributeName="opacity" values="0;0;0.85;0;0" dur="4.2s" repeatCount="indefinite"/>
    <animate attributeName="x" values="430;760" dur="4.2s" repeatCount="indefinite"/>
  </rect>

  <text x="600" y="232" text-anchor="middle" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" letter-spacing="3">LLM INFERENCE  /  CUDA  /  SYSTEMS</text>

  <!-- stage rail sitting on the floor -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <line x1="150" y1="548" x2="1050" y2="548" stroke="#21262d" stroke-width="2"/>
    <circle cx="210" cy="548" r="4" fill="#05080f" stroke="#58A6FF"/>
    <circle cx="470" cy="548" r="4" fill="#05080f" stroke="#58A6FF"/>
    <circle cx="730" cy="548" r="4" fill="#05080f" stroke="#58A6FF"/>
    <circle cx="990" cy="548" r="4" fill="#05080f" stroke="#3fb950"/>
    <circle r="4" fill="#3fb950" filter="url(#glow)">
      <animateMotion dur="4.6s" repeatCount="indefinite"><mpath xlink:href="#rail"/></animateMotion>
    </circle>
    <rect x="140" y="560" width="920" height="28" rx="4" fill="#05080f" opacity="0.88"/>
    <text x="210" y="580" text-anchor="middle" fill="#c9d1d9" font-size="13">MODEL</text>
    <text x="470" y="580" text-anchor="middle" fill="#c9d1d9" font-size="13">RUNTIME</text>
    <text x="730" y="580" text-anchor="middle" fill="#c9d1d9" font-size="13">SERVICE</text>
    <text x="990" y="580" text-anchor="middle" fill="#c9d1d9" font-size="13">PLATFORM</text>
  </g>

  <!-- viewport ticks -->
  <g fill="none" stroke="#3fb950" stroke-width="1.6" opacity="0.8">
    <path d="M18,18 H58 M18,18 V58"/>
    <path d="M1182,18 H1142 M1182,18 V58"/>
    <path d="M18,602 H58 M18,602 V562"/>
    <path d="M1182,602 H1142 M1182,602 V562"/>
  </g>
</svg>
